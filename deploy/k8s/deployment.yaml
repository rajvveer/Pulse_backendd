# Pulse Backend — Kubernetes Deployment
#
# Process model: one Node process per pod (one event loop). Scale OUT with
# replicas / the HPA below — the Socket.IO Redis adapter makes multi-pod
# real-time cluster-safe. Right-size `replicas` and the HPA bounds from load
# tests; the numbers here are a starting point, NOT a validated 100K config.
#
# Connection-pool math (CRITICAL): total Mongo connections ≈
#   MONGO_CONTAINER_POOL_BUDGET × maxReplicas.
# Keep that under your Atlas tier's connection cap. e.g. budget 40 × 30 pods
# = 1,200 connections — verify against the tier before raising either number.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulse-backend
  labels:
    app: pulse-backend
spec:
  replicas: 4
  selector:
    matchLabels:
      app: pulse-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%        # add capacity before removing old pods
      maxUnavailable: 0    # never drop below desired during a rollout
  template:
    metadata:
      labels:
        app: pulse-backend
    spec:
      # Give the graceful drain (readiness flip → LB deregister → socket
      # disconnect with jitter → close) time to complete before SIGKILL.
      terminationGracePeriodSeconds: 45
      containers:
        - name: pulse-backend
          image: pulse-backend:latest # set by your CI/CD
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            # One process per pod — DO NOT run cluster.js here (scale via
            # replicas instead). Pool budget is per POD.
            - name: MONGO_CONTAINER_POOL_BUDGET
              value: "40"
            # Secrets/config come from a Secret + ConfigMap (not inlined here).
          envFrom:
            - secretRef:
                name: pulse-backend-secrets
            - configMapRef:
                name: pulse-backend-config
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "768Mi"   # bounds upload buffering + heap; see UPLOAD_MAX_MB
          # Liveness: is the event loop alive? Cheap, dependency-free.
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          # Readiness: should the Service route here? Checks Mongo + Redis, so a
          # pod that loses a dependency is pulled from rotation instead of
          # blackholing requests.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              # Let the LB observe the readiness flip before the process exits.
              exec:
                command: ["sh", "-c", "sleep 5"]
---
apiVersion: v1
kind: Service
metadata:
  name: pulse-backend
  labels:
    app: pulse-backend
spec:
  selector:
    app: pulse-backend
  ports:
    - name: http
      port: 80
      targetPort: 3000
  # Websocket-only transport means no per-request affinity is required.
  # (If you enable SOCKET_ENABLE_POLLING, switch to sessionAffinity / a
  # cookie-affinity ingress.)
  type: ClusterIP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pulse-backend
spec:
  minAvailable: 75%
  selector:
    matchLabels:
      app: pulse-backend
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pulse-backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pulse-backend
  minReplicas: 4
  maxReplicas: 30   # ⚠️ pool budget × this must stay under the Atlas conn cap
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    # Active websocket connections are the real saturation signal for this
    # workload — feed in pulse_socket_connections via Prometheus Adapter and
    # uncomment to scale on it.
    # - type: Pods
    #   pods:
    #     metric:
    #       name: pulse_socket_connections
    #     target:
    #       type: AverageValue
    #       averageValue: "8000"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # avoid flapping on spiky traffic
